
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MECORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 40px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .user {
            background: #2563eb;
            text-align: right;
        }

        .ai {
            background: #334155;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .founder {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }

        .founder strong {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 MECORA</h1>

    <p class="subtitle">
        Your intelligent engineering assistant
    </p>

    <div id="chat"></div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask MECORA anything..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

    <div class="founder">
        Founded by <strong>Ahmed Bendag</strong><br>
        Mechatronics Engineering Student
    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    // Show user's message
    chat.innerHTML += `
        <div class="message user">
            ${message}
        </div>
    `;

    input.value = "";

    // Show loading message
    const loading = document.createElement("div");

    loading.className = "message ai";
    loading.textContent = "MECORA is thinking...";

    chat.appendChild(loading);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        loading.textContent = data.answer;

    } catch (error) {

        loading.textContent =
            "Sorry, MECORA encountered an error.";

        console.error(error);

    }

    chat.scrollTop = chat.scrollHeight;
}


// Press Enter to send
document.getElementById("message").addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);

</script>

</body>
</html>
